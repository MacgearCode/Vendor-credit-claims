{# Light / dark switch, top right of every page's top bar (user, 2026-10-21). Styled in
   sidenav.css like the ☰ button; the click handler is in _sidenav.html. #}
<button type="button" class="tm-btn{{ ' on-light' if tm_on_light }}" data-theme-toggle aria-label="Switch to dark mode" title="Light / dark mode">
  <svg class="tm-moon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="currentColor"/></svg>
  <svg class="tm-sun" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
</button>
