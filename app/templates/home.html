{% extends "base.html" %}
{% block title %}Macgear Internal Tools{% endblock %}
{% block content %}
<h1 class="home-title">Macgear Internal Tools</h1>

<div class="toolgrid">
  {% for t in tools %}
  <a class="toolcard" href="{{ t.href }}">
    <span class="toolcard-title">{{ t.title }}</span>
    <span class="toolcard-blurb">{{ t.blurb }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
